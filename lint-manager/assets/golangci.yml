# golangci-lint Configuration
# See https://golangci-lint.run/usage/configuration/

run:
  # Timeout for analysis
  timeout: 5m

  # Include test files
  tests: true

  # Which dirs to skip
  skip-dirs:
    - vendor
    - third_party
    - testutils
    - examples
    - Godeps
    - builtin

  # Which files to skip
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"

  # Modules download mode
  modules-download-mode: readonly

# Output configuration
output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  uniq-by-line: true
  sort-results: true

# Linters configuration
linters:
  disable-all: true
  enable:
    - gofmt
    - goimports
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - structcheck
    - varcheck
    - ineffassign
    - deadcode
    - typecheck
    - gosec
    - gocritic
    - goconst
    - misspell
    - gocyclo
    - dupl
    - goconst
    - misspell
    - lll
    - unconvert
    - prealloc
    - gocritic

  fast: false

linters-settings:
  govet:
    check-shadowing: true
    enable-all: true

  errcheck:
    check-type-assertions: true
    check-blank: true

  staticcheck:
    checks: ["all"]

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 2
    min-occurrences: 3

  misspell:
    locale: US

  lll:
    line-length: 140
    tab-width: 1

  goimports:
    local-prefixes: github.com/org/project

  prealloc:
    simple-loops: true
    range-loops: true
    for-loops: false

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - wrapperFunc
      - commentFormatting

issues:
  # Show all issues
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-use-default: false

  exclude-rules:
    # Exclude some staticcheck messages
    - linters:
        - staticcheck
      text: "SA9003:"

    # Exclude lll issues for long lines with go:generate
    - linters:
        - lll
      source: "^//go:generate "

severity:
  default-severity: error
  case-sensitive: false
  rules:
    - linters:
        - dupl
      severity: warning
    - linters:
        - goconst
      severity: warning
