# SwiftLint Configuration
# See https://github.com/realm/SwiftLint/blob/main/Configuration.md

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - force_unwrapping
  - implicitly_unwrapped_optional
  - closure_spacing
  - sorted_imports

excluded:
  - Pods
  - .build

included:
  - Sources
  - Tests

# Configure specific rules
line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - URL
    - url
    - x
    - y
    - z

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 40
    error: 50

large_tuple:
  warning: 3
  error: 4

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

custom_rules:
  marks:
    name: "Mark Comments"
    regex: '\\b(marks?|x?todo|fixme)\\b'
    message: "TODO or FIXME found"
    match_kinds:
      - comment
      - doc_comment
